[package]
name = "flipbook-maker"
version = "1.0.0"
description = "FlipbookMaker - Convert flipbooks to Markdown and upload to Confluence"
authors = ["FlipbookMaker Team"]
edition = "2021"

[lib]
name = "flipbook_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
